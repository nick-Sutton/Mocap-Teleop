[mocap]
camera_frequency = 240.0

[rigid_bodies]
root_name = "Root"
root_stream_id = 1
left_foot_name = "LFoot"
left_foot_stream_id = 2
right_foot_name = "RFoot"
right_foot_stream_id = 3

[networking]
use_multicast = false # Unicast = False / Multicast = True
server_address = "192.168.0.26" # Address in the Motive Software
local_address = "0.0.0.0" # Client Computers IP (Make sure they are on the same subnet)
multicast_address = "239.255.42.99"
command_port = 1510
data_port = 1511

[controller]
controller_path = "~/repos/mpac/mpac_go2/"
interface_subpath = "~/repos/mpac/mpac_go2/atnmy/"

[learning]
gait_classifier_path = "ModelV1.pth"
# Absolute path to trained α-net weights. Set to enable the CBF safety filter.
# Leave empty to run without the filter.
cbf_model_path = "alpha_net_v5.pth"

[logging]
logs_dir = "robot_logs"